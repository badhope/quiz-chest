name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful thing you can attach is a **minimal file
        that reproduces the problem** — a two-line CSV beats a paragraph of description.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web / PWA
        - Desktop (Tauri)
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings → About, or the release tag.
      placeholder: v1.1.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /import
        2. Paste the CSV below
        3. Click "校验并预览"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include console errors or a screenshot if you have them.
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Minimal reproducing data
      description: A small CSV or JSON payload, if the bug involves imported content.
      render: text
    validations:
      required: false
